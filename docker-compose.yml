version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pedales
      POSTGRES_PASSWORD: pedales
      POSTGRES_DB: pedales
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedales"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pedales:pedales@db:5432/pedales?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tienda.com}
      # Hash bcrypt de "admin123", SOLO para desarrollo local. Generá el
      # tuyo con: npm run hash-password -- "tu-password" (dentro de api/)
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-$$2a$$10$$xWP7.s/TuuL.FQeDJu9k/u4lnCuH/zZRuhh/aGNUPk.M2.l.VUGsy}
      PORT: 3001
      # MP_MOCK=true por defecto: sin credenciales reales en .env, la API
      # usa el proveedor mock y habilita la pantalla de "pago simulado".
      MP_MOCK: ${MP_MOCK:-true}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_SUCCESS_URL: http://localhost:3003/checkout/success
      MP_FAILURE_URL: http://localhost:3003/checkout/failure
      MP_PENDING_URL: http://localhost:3003/checkout/pending
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_NOTIFICATION_URL: ${MP_NOTIFICATION_URL:-https://YOUR_PUBLIC_DOMAIN/api/payments/webhook}
      MP_CURRENCY_ID: ARS
      FRONTEND_URL: http://localhost:3003
      ADMIN_URL: http://localhost:3002
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3001:3001"
    volumes:
      - ./api:/app
      - /app/node_modules
      - uploads_data:/app/uploads

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_INTERNAL_URL: http://api:3001
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3003:3000"   # (o el puerto que hayas dejado vos) 
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

  admin:
    build: ./admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3002:3000"
    volumes:
      - ./admin:/app
      - /app/node_modules
      - /app/.next

volumes:
  db_data:
  uploads_data:
