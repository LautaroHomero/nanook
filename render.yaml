services:
  - type: web
    name: nanook-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./api/Dockerfile.prod
    dockerContext: ./api
    healthCheckPath: /api
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: PORT
        value: 3001
      # api.tiendananook.store todavía no está conectado — dejamos
      # API_PUBLIC_URL y MP_NOTIFICATION_URL con la URL de Render hasta que
      # conectemos ese dominio (queda para el final, a propósito).
      - key: API_PUBLIC_URL
        value: https://nanook-api.onrender.com
      - key: MP_MOCK
        value: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_SUCCESS_URL
        value: https://tiendananook.store/checkout/success
      - key: MP_FAILURE_URL
        value: https://tiendananook.store/checkout/failure
      - key: MP_PENDING_URL
        value: https://tiendananook.store/checkout/pending
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_NOTIFICATION_URL
        value: https://nanook-api.onrender.com/api/payments/webhook
      - key: MP_CURRENCY_ID
        value: ARS
      - key: MP_SURCHARGE_PERCENT
        value: 4.3
      - key: BANK_TRANSFER_BANK_NAME
        value: BBVA
      - key: BANK_TRANSFER_CBU
        sync: false
      - key: BANK_TRANSFER_ALIAS
        sync: false
      - key: BANK_TRANSFER_HOLDER_NAME
        sync: false
      - key: BANK_TRANSFER_HOLDER_CUIT
        sync: false
      - key: FRONTEND_URL
        value: https://tiendananook.store
      - key: ADMIN_URL
        value: https://admin.tiendananook.store
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

# web y admin se despliegan en Vercel (Next.js nativo, sin Docker), cada
# uno como su propio proyecto con "Root Directory" = web/ o admin/. Los
# Dockerfile.prod de esas dos carpetas quedan sin uso por si en el futuro
# se decide volver a un hosting basado en contenedores.
