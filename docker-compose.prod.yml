services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}?schema=public
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?falta ADMIN_EMAIL en .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?falta ADMIN_PASSWORD_HASH en .env (generala con: npm run hash-password --prefix api -- "tu-password")}
      PORT: 3001
      API_PUBLIC_URL: ${API_PUBLIC_URL:?falta API_PUBLIC_URL en .env (dominio público de la API, usado para armar las URLs de las imágenes)}
      MP_MOCK: ${MP_MOCK:-false}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:?falta MP_ACCESS_TOKEN en .env}
      MP_SUCCESS_URL: ${MP_SUCCESS_URL:?falta MP_SUCCESS_URL en .env}
      MP_FAILURE_URL: ${MP_FAILURE_URL:?falta MP_FAILURE_URL en .env}
      MP_PENDING_URL: ${MP_PENDING_URL:?falta MP_PENDING_URL en .env}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:?falta MP_WEBHOOK_SECRET en .env}
      MP_NOTIFICATION_URL: ${MP_NOTIFICATION_URL:?falta MP_NOTIFICATION_URL en .env}
      MP_CURRENCY_ID: ARS
      FRONTEND_URL: ${FRONTEND_URL:?falta FRONTEND_URL en .env}
      ADMIN_URL: ${ADMIN_URL:?falta ADMIN_URL en .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:?}
      API_INTERNAL_URL: http://api:3001
    ports:
      - "3003:3000"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:?}
    ports:
      - "3002:3000"

volumes:
  db_data:
  uploads_data:
